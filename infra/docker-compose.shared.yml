# AppForge AI Studio — educational single-user layout for a shared Docker host.
#
# This file is intentionally standalone. It does not publish 80/443 and it does
# not start Caddy. The host's existing reverse proxy must forward /appforge/ to
# 127.0.0.1:${APPFORGE_SHARED_PORT:-3201}. All resource names are separate from
# the legacy AppForge installation and from unrelated Docker workloads.

name: appforge-edu

services:
  data-init:
    image: busybox:1.37.0
    user: "0:0"
    network_mode: none
    command: ["sh", "-eu", "-c", "chown -R 1000:1000 /data/appforge && chmod 0700 /data/appforge"]
    volumes:
      - appforge-edu-data:/data/appforge
    restart: "no"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt:
      - no-new-privileges:true

  studio:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: appforge-edu-studio
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-998}"
    env_file:
      - ../.env
    environment:
      DATA_DIR: /data/appforge
      PORT: "3001"
      APPFORGE_PRODUCTION: "1"
      APPFORGE_TEMPLATES_DIR: /app/templates
      APPFORGE_DEPLOY_DRIVER: docker
      APPFORGE_ENABLE_DOCKER_DEPLOY: "1"
      APPFORGE_DOCKER_NETWORK: appforge-edu-apps
      APPFORGE_DOCKER_DATA_VOLUME: appforge-edu-data
      APPFORGE_MAX_CONCURRENT_DEPLOYS: "1"
      HOME: /tmp/appforge-home
    ports:
      - "127.0.0.1:${APPFORGE_SHARED_PORT:-3201}:3001"
    volumes:
      - appforge-edu-data:/data/appforge
      # Host-equivalent privilege. The trusted driver is fail-closed and may
      # mutate only resources carrying AppForge ownership labels.
      - /var/run/docker.sock:/var/run/docker.sock:rw
    networks:
      - appforge-edu-control
      - appforge-edu-apps
    depends_on:
      data-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=384m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 384
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  appforge-edu-data:
    name: appforge-edu-data
    labels:
      com.appforge.managed: "true"
      com.appforge.component: studio-data
      com.appforge.installation: educational

networks:
  appforge-edu-control:
    name: appforge-edu-control
    labels:
      com.appforge.managed: "true"
      com.appforge.component: control-network
      com.appforge.installation: educational
  appforge-edu-apps:
    name: appforge-edu-apps
    internal: true
    labels:
      com.appforge.managed: "true"
      com.appforge.component: network
      com.appforge.installation: educational
