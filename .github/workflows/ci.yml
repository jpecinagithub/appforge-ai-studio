name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/studio/package-lock.json

      - name: Install backend and worker dependencies
        run: npm ci

      - name: Install Studio dependencies
        run: npm ci --prefix apps/studio

      - name: Verify AppForge
        run: npm run verify
        env:
          APPFORGE_BROWSER_EXECUTABLE: /usr/bin/google-chrome

  # Piloto dinámico (CONTRACT.md §9): la plantilla debe compilar y sus
  # 17 pruebas deben pasar en CI, no solo en local. Corre en Ubuntu y
  # Windows: los scripts usan fileURLToPath() y el smoke test levanta
  # el servidor real en ambos.
  dynamic-template:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            templates/dynamic-react-node/backend/package-lock.json
            templates/dynamic-react-node/frontend/package-lock.json

      - name: Install template dependencies (reproducible)
        run: node scripts/install.mjs
        working-directory: templates/dynamic-react-node

      - name: Build template (frontend + backend)
        run: npm run build
        working-directory: templates/dynamic-react-node

      - name: Run template tests
        run: npm test
        working-directory: templates/dynamic-react-node

      - name: Smoke test (npm start serves /healthz)
        working-directory: templates/dynamic-react-node
        shell: bash
        run: |
          PORT=18099 DB_PATH="./data/smoke.db" npm start > "$RUNNER_TEMP/smoke.log" 2>&1 &
          SRV_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18099/healthz; then
              echo
              kill $SRV_PID 2>/dev/null || true
              rm -f ./data/smoke.db*
              echo "SMOKE_OK"
              exit 0
            fi
            sleep 2
          done
          echo "SMOKE_FAIL"
          cat "$RUNNER_TEMP/smoke.log"
          kill $SRV_PID 2>/dev/null || true
          exit 1
