name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/studio/package-lock.json

      - name: Install backend and worker dependencies
        run: npm ci

      - name: Install Studio dependencies
        run: npm ci --prefix apps/studio

      - name: Verify AppForge
        run: npm run verify
        env:
          APPFORGE_BROWSER_EXECUTABLE: /usr/bin/google-chrome

  # Piloto dinámico (CONTRACT.md §9): la plantilla debe compilar y sus
  # 17 pruebas deben pasar en CI, no solo en local. Corre en Ubuntu y
  # Windows: los scripts usan fileURLToPath() y el smoke test levanta
  # el servidor real en ambos.
  dynamic-template:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            templates/dynamic-react-node/backend/package-lock.json
            templates/dynamic-react-node/frontend/package-lock.json

      - name: Install template dependencies (reproducible)
        run: node scripts/install.mjs
        working-directory: templates/dynamic-react-node

      - name: Build template (frontend + backend)
        run: npm run build
        working-directory: templates/dynamic-react-node

      - name: Run template tests
        run: npm test
        working-directory: templates/dynamic-react-node

      - name: Smoke test (server boots and /healthz answers)
        run: node scripts/smoke-test.mjs
        working-directory: templates/dynamic-react-node

  # Fase 7A: driver Docker + pruebas aisladas (CONTRACT.md §9.22).
  # Construye la plantilla real, levanta contenedores endurecidos en una red
  # interna propia y verifica backup/restore/rollback. Recursos únicos por
  # run (APPFORGE_TEST_RUN_ID) y limpieza garantizada en always().
  # Nunca toca Oracle ni secretos de producción.
  docker-driver-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPFORGE_DOCKER_INTEGRATION: strict
      APPFORGE_TEST_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/studio/package-lock.json

      - name: Install backend and worker dependencies
        run: npm ci

      - name: Docker driver integration tests (strict)
        run: npx vitest run src/docker/integration.test.ts
        working-directory: apps/worker

      - name: Cleanup Docker test resources (always)
        if: always()
        run: |
          LBL="com.appforge.test-run=${{ github.run_id }}"
          docker ps -aq --filter "label=$LBL" | xargs -r docker rm -f || true
          docker ps -aq --filter "label=com.appforge.managed=true" | xargs -r docker rm -f || true
          docker volume ls -q --filter "label=$LBL" | xargs -r docker volume rm || true
          docker volume ls -q --filter "label=com.appforge.managed=true" | xargs -r docker volume rm || true
          docker images -q --filter "label=com.appforge.managed=true" | xargs -r docker rmi -f || true
          docker network rm "af-test-net-${{ github.run_id }}" 2>/dev/null || true
          docker volume rm "af-test-data-${{ github.run_id }}" 2>/dev/null || true

  # Fase 7C.1: validate and boot the exact production image/compose on a
  # disposable Linux runner. It uses no Oracle access and no real secrets.
  production-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Create ephemeral production environment
        shell: bash
        run: |
          cp .env.example .env
          token=$(openssl rand -hex 32)
          gid=$(stat -c %g /var/run/docker.sock)
          sed -i "s/^APPFORGE_ADMIN_TOKEN=.*/APPFORGE_ADMIN_TOKEN=$token/" .env
          sed -i 's|^CORS_ORIGIN=.*|CORS_ORIGIN=http://127.0.0.1|' .env
          sed -i 's/^APPFORGE_PRODUCTION=.*/APPFORGE_PRODUCTION=1/' .env
          sed -i "s/^DOCKER_GID=.*/DOCKER_GID=$gid/" .env
          sed -i 's/^GROQ_API_KEY=.*/GROQ_API_KEY=ci-placeholder-key-000000000000/' .env
          chmod 600 .env

      - name: Run production preflight
        shell: bash
        run: |
          bash -n infra/scripts/install.sh infra/scripts/preflight.sh
          cp .env /tmp/appforge-insecure.env
          chmod 644 /tmp/appforge-insecure.env
          if bash infra/scripts/preflight.sh --env /tmp/appforge-insecure.env --compose infra/docker-compose.yml; then
            echo "preflight accepted an insecure env mode" >&2
            exit 1
          fi
          chmod 600 /tmp/appforge-insecure.env
          printf '\nAPPFORGE_ADMIN_TOKEN=duplicate-must-fail\n' >> /tmp/appforge-insecure.env
          if bash infra/scripts/preflight.sh --env /tmp/appforge-insecure.env --compose infra/docker-compose.yml; then
            echo "preflight accepted a duplicate secret key" >&2
            exit 1
          fi
          rm -f /tmp/appforge-insecure.env
          bash infra/scripts/preflight.sh --env .env --compose infra/docker-compose.yml

      - name: Validate production compose
        run: docker compose --env-file .env -f infra/docker-compose.yml config --quiet

      - name: Build and boot trusted Studio
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --build studio

      - name: Verify production invariants
        shell: bash
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' appforge-studio 2>/dev/null || true)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' appforge-studio)" = healthy
          test "$(docker inspect --format '{{.Config.User}}' appforge-studio)" = "1000:1000"
          docker exec appforge-studio curl --fail --silent http://127.0.0.1:3001/healthz
          docker exec appforge-studio docker version --format '{{.Client.Version}}'
          test "$(docker network inspect --format '{{.Internal}}' appforge-apps)" = true
          test "$(docker network inspect --format '{{index .Labels "com.appforge.component"}}' appforge-apps)" = network
          test "$(docker volume inspect --format '{{index .Labels "com.appforge.component"}}' appforge-data)" = studio-data

      - name: Cleanup production smoke resources (always)
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml down -v --remove-orphans || true
          rm -f .env
